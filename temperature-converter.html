<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .unit-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .radio-option {
            position: relative;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .radio-option label {
            display: block;
            padding: 1rem;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #666;
        }

        .radio-option input[type="radio"]:checked+label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .radio-option label:hover {
            border-color: #667eea;
        }

        .convert-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .convert-btn:active {
            transform: translateY(0);
        }

        .results {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 2rem;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        .result-title {
            text-align: center;
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .result-item {
            background: white;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .result-label {
            color: #666;
            font-weight: 600;
        }

        .result-value {
            color: #667eea;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            border-left: 4px solid #c33;
        }

        .error.show {
            display: block;
            animation: shake 0.5s ease;
        }

        .back-home {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            color: #667eea;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .back-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 2rem;
            }

            .unit-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌡️ Temperature Converter</h1>
        <p class="subtitle">Convert between Celsius, Fahrenheit, and Kelvin</p>

        <div class="error" id="error"></div>

        <div class="input-group">
            <label for="temperature">Enter Temperature</label>
            <input type="number" id="temperature" placeholder="Enter a number" step="0.01">
        </div>

        <div class="input-group">
            <label>Select Input Unit</label>
            <div class="unit-selector">
                <div class="radio-option">
                    <input type="radio" id="celsius" name="unit" value="celsius" checked>
                    <label for="celsius">Celsius (°C)</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="fahrenheit" name="unit" value="fahrenheit">
                    <label for="fahrenheit">Fahrenheit (°F)</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="kelvin" name="unit" value="kelvin">
                    <label for="kelvin">Kelvin (K)</label>
                </div>
            </div>
        </div>

        <button class="convert-btn" onclick="convertTemperature()">Convert Temperature</button>

        <div class="results" id="results">
            <div class="result-title">Conversion Results</div>
            <div class="result-item">
                <span class="result-label">Celsius</span>
                <span class="result-value" id="celsiusResult">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Fahrenheit</span>
                <span class="result-value" id="fahrenheitResult">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Kelvin</span>
                <span class="result-value" id="kelvinResult">-</span>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-home">← Back to Hub</a>

    <script>
        function convertTemperature() {
            const tempInput = document.getElementById('temperature');
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');

            // Get input value
            const temp = parseFloat(tempInput.value);

            // Validate input
            if (tempInput.value === '' || isNaN(temp)) {
                showError('Please enter a valid number');
                resultsDiv.classList.remove('show');
                return;
            }

            // Get selected unit
            const unit = document.querySelector('input[name="unit"]:checked').value;

            // Convert to all units
            let celsius, fahrenheit, kelvin;

            switch (unit) {
                case 'celsius':
                    celsius = temp;
                    fahrenheit = (temp * 9 / 5) + 32;
                    kelvin = temp + 273.15;
                    break;
                case 'fahrenheit':
                    celsius = (temp - 32) * 5 / 9;
                    fahrenheit = temp;
                    kelvin = (temp - 32) * 5 / 9 + 273.15;
                    break;
                case 'kelvin':
                    if (temp < 0) {
                        showError('Kelvin cannot be negative (absolute zero is 0K)');
                        resultsDiv.classList.remove('show');
                        return;
                    }
                    celsius = temp - 273.15;
                    fahrenheit = (temp - 273.15) * 9 / 5 + 32;
                    kelvin = temp;
                    break;
            }

            // Display results
            document.getElementById('celsiusResult').textContent = celsius.toFixed(2) + ' °C';
            document.getElementById('fahrenheitResult').textContent = fahrenheit.toFixed(2) + ' °F';
            document.getElementById('kelvinResult').textContent = kelvin.toFixed(2) + ' K';

            // Show results, hide error
            errorDiv.classList.remove('show');
            resultsDiv.classList.add('show');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }

        // Allow Enter key to convert
        document.getElementById('temperature').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                convertTemperature();
            }
        });
    </script>
</body>

</html>
